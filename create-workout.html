<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YooFit – Diseñar Rutina</title>
  <meta name="description" content="Diseña tu propia rutina de ejercicios personalizada." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/create-workout.css" />
</head>

<body>
  <div class="phone-shell">
    <div class="phone-frame">
      <div class="screen">

        <!-- Scroll area -->
        <div class="scroll-area">

          <!-- Header -->
          <div class="header">
            <div class="header-left">
              <h1>Nueva Rutina</h1>
              <p>Diseña un entrenamiento a tu medida</p>
            </div>
          </div>

          <!-- Form Area -->
          <div class="section">
            <form id="create-routine-form" onsubmit="saveRoutine(event)">
              
              <!-- General Info -->
              <div class="card form-card">
                <div class="form-group">
                  <label class="form-label" for="routine-name">Nombre de la Rutina</label>
                  <input type="text" id="routine-name" placeholder="Ej: Chest Day, Full Body" required />
                </div>

                <div class="form-row-grid">
                  <div class="form-group">
                    <label class="form-label" for="routine-duration">Duración (min)</label>
                    <input type="number" id="routine-duration" placeholder="Ej: 60" min="1" required />
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="routine-kcal">Calorías (kcal)</label>
                    <input type="number" id="routine-kcal" placeholder="Ej: 450" min="1" required />
                  </div>
                </div>

                <div class="form-group">
                  <label class="form-label" for="routine-day">Día Programado</label>
                  <select id="routine-day" required>
                    <option value="" disabled selected>Selecciona un día</option>
                    <option value="Lunes">Lunes</option>
                    <option value="Martes">Martes</option>
                    <option value="Miércoles">Miércoles</option>
                    <option value="Jueves">Jueves</option>
                    <option value="Viernes">Viernes</option>
                    <option value="Sábado">Sábado</option>
                    <option value="Domingo">Domingo</option>
                  </select>
                </div>
              </div>

              <!-- Exercises Header -->
              <div class="section-title" style="margin-top: 24px;">
                <h2>Ejercicios</h2>
                <button type="button" class="add-exercise-btn" onclick="addExerciseRow()">+ Agregar Ejercicio</button>
              </div>

              <!-- Exercises Container -->
              <div id="exercises-container">
                <!-- JS will inject exercise rows here, we start with 1 row -->
              </div>

              <!-- Action buttons -->
              <div class="form-actions-wrap" style="margin-top: 24px;">
                <button type="submit" class="btn btn-primary">Guardar Rutina</button>
                <a href="workout.html" class="btn btn-outline" style="text-align: center; text-decoration: none; display: block; margin-top: 12px;">Cancelar</a>
              </div>

            </form>
          </div>

        </div><!-- /scroll-area -->

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
          <a href="home.html" class="nav-item" id="nav-home">
            <span class="nav-icon"><img src="assets/home.png" alt="Home" /></span>
          </a>
          <a href="workout.html" class="nav-item" id="nav-workout">
            <span class="nav-icon"><img src="assets/fitness.png" alt="Workout" /></span>
          </a>
          <a href="create-workout.html" class="nav-plus active" id="nav-plus" aria-label="Añadir">+</a>
          <a href="calendar.html" class="nav-item" id="nav-calendar">
            <span class="nav-icon"><img src="assets/calendar.png" alt="Calendar" /></span>
          </a>
          <a href="membership.html" class="nav-item" id="nav-profile">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="rgba(255,255,255,0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
          </a>
        </nav>

      </div>
    </div>
  </div>

  <script src="js/create-workout.js"></script>
</body>

</html>
