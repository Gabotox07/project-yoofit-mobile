<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YooFit – Calendario</title>
  <meta name="description" content="Consulta tu calendario de entrenamientos programados." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/calendar.css" />
</head>

<body>
  <div class="phone-shell">
    <div class="phone-frame">
      <div class="screen">

        <!-- Scroll area -->
        <div class="scroll-area">

          <!-- Header -->
          <div class="header">
            <div class="header-left">
              <h1>Calendario</h1>
              <p>Tus entrenamientos de este mes</p>
            </div>
            <div class="header-actions">
              <a href="create-workout.html" class="icon-btn add-btn" id="btn-add" aria-label="Crear entrenamiento">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                  fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </a>
            </div>
          </div>

          <!-- Month Navigator -->
          <div class="month-navigator">
            <button class="nav-month-btn" id="prev-month" aria-label="Mes anterior">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <h2 class="current-month-label" id="current-month-label">Julio 2026</h2>
            <button class="nav-month-btn" id="next-month" aria-label="Siguiente mes">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>

          <!-- Calendar grid -->
          <div class="calendar-section">
            <!-- Day names -->
            <div class="weekday-row">
              <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
            </div>
            <!-- Days grid - rendered by JS -->
            <div class="days-grid" id="days-grid"></div>
          </div>

          <!-- Selected Day Panel -->
          <div class="day-detail-section" id="day-detail-section" style="display:none;">
            <div class="section-title">
              <h2 id="day-detail-title">Lunes 7 de julio</h2>
              <a href="create-workout.html" class="detail-add-link">+ Agregar</a>
            </div>
            <div id="day-routines-container"></div>
          </div>

          <!-- No day selected placeholder -->
          <div class="empty-day-hint" id="empty-day-hint">
            <div class="hint-icon">📅</div>
            <p>Selecciona un día para ver tus<br/>entrenamientos programados.</p>
          </div>

          <!-- Weekly Summary -->
          <div class="weekly-summary-section">
            <div class="section-title">
              <h2>Resumen Semanal</h2>
            </div>
            <div class="summary-grid" id="summary-grid">
              <!-- Rendered by JS -->
            </div>
          </div>

        </div><!-- /scroll-area -->

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
          <a href="home.html" class="nav-item" id="nav-home">
            <span class="nav-icon"><img src="assets/home.png" alt="Home" /></span>
          </a>
          <a href="workout.html" class="nav-item" id="nav-workout">
            <span class="nav-icon"><img src="assets/fitness.png" alt="Workout" /></span>
          </a>
          <a href="create-workout.html" class="nav-plus" id="nav-plus" aria-label="Añadir">+</a>
          <a href="calendar.html" class="nav-item active" id="nav-calendar">
            <span class="nav-icon"><img src="assets/calendar.png" alt="Calendar" /></span>
          </a>
          <a href="membership.html" class="nav-item" id="nav-profile">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="rgba(255,255,255,0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
          </a>
        </nav>

      </div>
    </div>
  </div>

  <script src="js/calendar.js"></script>
</body>

</html>
