<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YooFit – Bienvenido</title>
  <meta name="description" content="YooFit – Tu app de fitness. Únete y supera tus límites." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/index.css" />
</head>
<body>
  <div class="phone-shell">
    <div class="phone-frame">
      <div class="screen">

        <!-- Brand -->
        <div class="brand">
          <p class="brand-welcome">Bienvenido a</p>
          <img src="assets/LOGO.png" alt="YooFit logo" class="brand-logo" />
        </div>

        <!-- CTA buttons -->
        <div class="cta-group">
          <a href="login.html" class="btn btn-primary" id="btn-login">
            <span class="btn-text">Iniciar sesión</span>
            <span class="btn-arrow">›</span>
          </a>
          <a href="register.html" class="btn btn-outline" id="btn-register">
            <span class="btn-text">Crear cuenta</span>
            <span class="btn-arrow">›</span>
          </a>
        </div>

        <!-- Divider -->
        <div class="divider"><span>o continúa con</span></div>

        <!-- Social login -->
        <div class="social-row">
          <button class="social-btn" id="btn-google" aria-label="Continuar con Google">
            <img src="assets/google-logo.png" alt="Google" />
          </button>
          <button class="social-btn" id="btn-apple" aria-label="Continuar con Apple">
            <img src="assets/apple-logo.png" alt="Apple" />
          </button>
          <button class="social-btn" id="btn-facebook" aria-label="Continuar con Facebook">
            <img src="assets/facebook-logo.png" alt="Facebook" />
          </button>
        </div>

        <!-- Terms -->
        <p class="terms">
          Al continuar, aceptas nuestros<br />
          <a href="#">Términos y Condiciones y Política de Privacidad</a>
        </p>

      </div>
    </div>
  </div>
</body>
</html>
