<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YooFit – Inicio</title>
  <meta name="description" content="Dashboard de entrenamiento YooFit – Tu actividad diaria." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/home.css" />
</head>

<body>
  <div class="phone-shell">
    <div class="phone-frame">
      <div class="screen">

        <!-- Scroll area -->
        <div class="scroll-area">

          <!-- Header -->
          <div class="header">
            <div class="header-left">
              <h1>Hola, <span>nombre</span></h1>
              <p>¿Listo para superar tus límites hoy?</p>
            </div>
            <div class="header-actions">
              <button class="icon-btn" id="btn-search" aria-label="Buscar">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
              </button>
              <button class="icon-btn" id="btn-bell" aria-label="Notificaciones">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Discipline section -->
          <div class="section">
            <div class="card">
              <div class="section-title">
                <h2>Tu disciplina</h2>
                <a href="#">Ver más</a>
              </div>

              <!-- Day circles -->
              <div class="day-circles" id="day-circles">
                <!-- JS renders these -->
              </div>

              <!-- Workout card -->
              <div class="workout-card">
                <div class="workout-info">
                  <p class="day-label">Día 4</p>
                  <h3>Back Day</h3>
                  <div class="workout-meta">
                    <span>⏱ 90 min.</span>
                    <span>🔥 600 kcal.</span>
                  </div>
                </div>
                <div class="workout-img">
                  <img src="assets/1366_2000.jpeg" alt="Back Day Workout" />
                </div>
              </div>
            </div>
          </div>

          <!-- Activity section -->
          <div class="section">
            <div class="card">
              <div class="section-title">
                <h2>Tu actividad</h2>
                <a href="#">Ver más</a>
              </div>

              <div class="activity-grid">
                <!-- Workout -->
                <div class="activity-item">
                  <h4>Workout</h4>
                  <div class="donut-wrap">
                    <svg class="donut-svg" viewBox="0 0 76 76">
                      <circle class="donut-track" cx="38" cy="38" r="30" />
                      <circle class="donut-fill" cx="38" cy="38" r="30" data-pct="75" />
                    </svg>
                    <div class="donut-label">75%</div>
                  </div>
                  <p>5 series restantes</p>
                </div>

                <!-- Tonnage -->
                <div class="activity-item">
                  <h4>Tonnage</h4>
                  <div class="donut-wrap">
                    <svg class="donut-svg" viewBox="0 0 76 76">
                      <circle class="donut-track" cx="38" cy="38" r="30" />
                      <circle class="donut-fill" cx="38" cy="38" r="30" data-pct="75" />
                    </svg>
                    <div class="donut-label">75%</div>
                  </div>
                  <p>25% restante</p>
                </div>

                <!-- Progreso -->
                <div class="activity-item">
                  <h4>Progreso</h4>
                  <div class="donut-wrap">
                    <svg class="donut-svg" viewBox="0 0 76 76">
                      <circle class="donut-track" cx="38" cy="38" r="30" />
                      <circle class="donut-fill" cx="38" cy="38" r="30" data-pct="75" />
                    </svg>
                    <div class="donut-label">75%</div>
                  </div>
                  <p>25% restante</p>
                </div>
              </div>
            </div>
          </div>

        </div><!-- /scroll-area -->

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
          <a href="home.html" class="nav-item active" id="nav-home">
            <span class="nav-icon"><img src="assets/home.png" alt="Home" /></span>
          </a>
          <button class="nav-item" id="nav-workout">
            <span class="nav-icon"><img src="assets/fitness.png" alt="Workout" /></span>
          </button>
          <button class="nav-plus" id="nav-plus" aria-label="Añadir">+</button>
          <a href="#" class="nav-item" id="nav-calendar">
            <span class="nav-icon"><img src="assets/calendar.png" alt="Calendar" /></span>
          </a>
          <a href="membership.html" class="nav-item" id="nav-profile">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="rgba(255,255,255,0.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
          </a>
        </nav>

      </div>
    </div>
  </div>

  <script src="js/home.js"></script>
</body>

</html>
